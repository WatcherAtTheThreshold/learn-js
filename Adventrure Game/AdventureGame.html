<html>

<head>
    <meta charset="UTF-8">
    <title>Adventure Game</title>
    <style>
      body {
        font-family: 'Arial', sans-serif;
        background-color: #f0e68c;
        margin: 0;
        padding: 0;
      }

      #game-container {
        width: 80%;
        margin: 20px auto;
        padding: 20px;
        background-color: #fff8dc;
        border: 2px solid #deb887;
        border-radius: 10px;

      }

      #scene-image {
        width: 100%;
        height: 600px;
        background-image: url('images/background-1.png');
        background-size: cover;
        background-position: center;
        border-radius: 10px;
      }
      #scene-description {
        margin-top: 20px;
        font-size: 24px;
        color: #333;
        text-align: center;

      }
      #choices {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        gap: 20px;

      }
        #choices button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #deb887;
            border: 2px solid #c0c0c0;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #choices button:hover {
            background-color: #d2b48c;
        }


    </style>
</head>
<body>
   <div id="game-container">
    <div id="scene-image"></div>
    <div id="scene-description">You look upon a small, glowing creature. Warmth and safety fill you.</div>
    <div id="choices">
      <button onclick="makeChoice(1)">Talk to the creature</button>
      <button onclick="makeChoice(2)">Stay silent</button>
      <button onclick="makeChoice(3)">Try to communicate</button>
    </div>
    <div id="exit"
   </div>

    <script>
       
    </script>
</body>
</html>
