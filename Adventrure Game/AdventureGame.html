<html>

<head>
    <meta charset="UTF-8">
    <title>Adventure Game</title>
    <style>
      body {
        font-family: 'Arial', sans-serif;
        background-color: #f3f5f7
        ;
        margin: 0;
        padding: 0;
      }

      .clouds {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 500vh;
        background-image: url('images/mist-overlay.png');
        background-repeat: repeat;
        background-size: auto;
        z-index: -4;
      }

    .clouds-1 {
      opacity: 0.8;
      z-index: -3;
      animation: mistDrift1 140s linear infinite;
    }

    .clouds-2 {
      opacity: 0.4;
      z-index: -2;
      animation: mistDrift2 100s linear infinite;
    }

    .clouds-3 {
      opacity: 0.2;
      z-index: -1;
      animation: mistDrift3 80s linear infinite;
    }

    @keyframes mistDrift1 {
      from { background-position: 0 0; }
      to { background-position: -600px 400px; }
    }

    @keyframes mistDrift2 {
      from { background-position: -200px 100px; }
      to { background-position: 300px -500px; }
    }

    @keyframes mistDrift3 {
      from { background-position: 100px -50px; }
      to { background-position: -400px 600px; }
    }


      #game-container {
        width: 60%;
        margin: 20px auto;
        padding: 20px;
        background-color: #e2dfd6;
        border: 2px solid #4b4944;
        border-radius: 10px;

      }

      #scene-image {
        width: 100%;
        height: 700px;
        background-image: url('images/background-1.png');
        background-size: cover;
        background-position: center;
        border: 4px solid #26475e;

        border-radius: 10px;
      }
      #scene-description {
        margin-top: 20px;
        font-size: 24px;
        color: #333;
        text-align: center;

      }
      #choices {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        gap: 20px;

      }
        #choices button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #979b97;
            border: 2px solid #393b39;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #choices button:hover {
            background-color: #f7f5ef;
        }


    </style>
</head>
<body>
  
  <div class="clouds clouds-1"></div>
  <div class="clouds clouds-2"></div>
  <div class="clouds clouds-3"></div>
  <div id="game-container">
    <div id="scene-image"></div>
    <div id="scene-description"></div>
    <div id="choices">
    </div>
  </div>
 
<script>
  let currentScene = 0;

     const scenes = [
      {
        id: 0,
        description: "A sprawling landscape stretches before you.",
        image: "images/background-1.png",
        choices: [
          { text: "Explore the ground around you", leadsTo: 1 },
          { text: "Scan the distant horizons", leadsTo: 0  },
      ]
      },
      {
        id: 1,
        description: "You kneel and examine the mossy ground.",
        image: "images/background-2.png",
        choices: [
          { text: "Stand back up", leadsTo: 2 }
        ]
      },
      {
        id: 2,
        description: "You hike the faint trail to the north and discover a hidden waterfall.",
        image: "images/background-3.png",
        choices: [
          { text: "Rest now, regulate yourself", leadsTo: 3 }
        ]
      },
      {
        id: 3,
        description: "You hike the faint trail to the south and find an ancient stone altar.",
        image: "images/background-4.png",
        choices: [
          { text: "Return to the starting point", leadsTo: 0 }
        ]
      }
      
     ];
     
    

     function makeChoice(choiceIndex){
      const scene = scenes[currentScene];
      const choice = scene.choices[choiceIndex];
      showScene(choice.leadsTo);
      currentScene = choice.leadsTo;
     }

     function showScene(index) {
      const scene = scenes[index];
      document.getElementById('scene-description').textContent = scene.description;
      const choicesDiv = document.getElementById('choices');
      choicesDiv.innerHTML = '';
      scene.choices.forEach((choice, index) => {
      const button = document.createElement('button');
      button.textContent = choice.text;
      button.onclick = () => makeChoice(index);
      choicesDiv.appendChild(button);
      });
      document.getElementById('scene-image').style.backgroundImage = 'url(' + scene.image + ')';
     }


     
     showScene(0);
</script>
</body>
</html>
